name: CI/CD

on:
  push:
    # Every branch push must trigger CI: this repo is developed via Gitea PRs
    # and this workflow only runs on the GitHub push mirror, so branch push
    # runs are the merge gate. Do NOT narrow these branches — duplicate runs
    # are deduped by the concurrency group below instead. See issue #213.
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  # Manual lever: rerun CI or re-publish docs from main without a new commit.
  workflow_dispatch:

# A push run and a pull_request run for the same commit share a group, so the
# duplicate is cancelled instead of running lint+test twice. Tag runs and main
# runs are keyed by ref, not SHA: each gets a group no branch push or PR can
# join (a new branch whose head equals main's head would otherwise cancel the
# in-flight main run and silently lose its docs deploy), and tag runs are
# additionally never cancelled so an in-flight release cannot be killed by a
# branch push. See issue #213 and PR #250 review.
concurrency:
  group: ci-${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && github.ref || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Default every job to a read-only token (PR #253 security review). Jobs that
# genuinely write (release upload, GHCR push, Pages deploy) already declare
# their own per-job permissions blocks, which override this default.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned (not "latest") so lint results are reproducible; v2.x is
          # required for repos with a go >= 1.25 directive. See issue #213.
          version: v2.11.4

      - name: Check swagger spec is up to date
        # Governing: SPEC-0007 REQ "Spec Freshness in CI"
        # `make swagger` runs swag via `go run ...@$(SWAG_VERSION)`, pinned to
        # the go.mod version that generated the committed output — no unpinned
        # go-install that would break every run when a newer swag release
        # changes the generated output. See issue #213.
        run: |
          make swagger
          if ! git diff --exit-code docs/swagger/; then
            echo "::error::docs/swagger/ is stale. Run 'make swagger' and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain docs/swagger/)" ]; then
            echo "::error::docs/swagger/ has untracked files. Run 'make swagger' and commit the result."
            git status --porcelain docs/swagger/
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check built CSS is up to date
        # Same freshness contract as the swagger check above: the committed
        # web/static/css/app.css must match what `make css` produces from the
        # current templates, or Tailwind classes added in templates silently
        # ship unstyled to anyone running the committed artifact. Caught a
        # real instance on introduction (missing .tab styles). See issue #213.
        run: |
          npm ci --ignore-scripts
          npm run build
          if ! git diff --exit-code web/static/css/; then
            echo "::error::web/static/css/ is stale. Run 'npm ci && npm run build' (make css assumes fresh node_modules) and commit the result."
            exit 1
          fi
          if [ -n "$(git status --porcelain web/static/css/)" ]; then
            echo "::error::web/static/css/ has untracked files. Run 'npm ci && npm run build' and commit the result."
            git status --porcelain web/static/css/
            exit 1
          fi

      - name: Lint extension (AMO addons-linter)
        # Pinned (not "latest") so lint results are reproducible, same as
        # golangci-lint above. See issue #213.
        run: npx addons-linter@10.9.0 integrations/extension/ --min-manifest-version 3 --max-manifest-version 3 --warnings-as-errors=false

      - name: Validate extension JS syntax
        run: |
          node --check integrations/extension/background.js
          node --check integrations/extension/options.js
          node --check integrations/extension/popup.js
          test -f integrations/extension/icons/icon-16.png && test -f integrations/extension/icons/icon-48.png && test -f integrations/extension/icons/icon-128.png
          echo "Extension OK"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        # -race: the click-recording pipeline, session middleware, and MCP
        # handler all touch shared state from goroutines; run the detector in
        # CI where the extra runtime cost doesn't matter. See issue #213.
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run extension unit tests
        # The shell expands the glob to explicit file paths, so this works on
        # Node < 21 (node --test only learned glob patterns in Node 21).
        run: node --test integrations/extension/*.test.mjs

  xcode:
    name: Xcode (unsigned build check)
    # Catches extension changes that break the committed Safari Web Extension
    # Xcode project (SPEC-0015, issue #133). Unsigned on purpose: no Apple
    # credentials in CI until #221/#134 land — CODE_SIGNING_ALLOWED=NO builds
    # everything except the signature. Gated behind a paths check so the slow
    # macOS runner only spins up when Apple/extension files changed.
    runs-on: ubuntu-latest
    # paths-filter reads the PR file list via the API on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - uses: actions/checkout@v4
      # SHA-pinned (not a mutable tag): third-party action in the same niche
      # as the 2025 tj-actions/changed-files tag-repoint compromise. See PR
      # #253 security review.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            apple:
              - 'integrations/apple/**'
              - 'integrations/extension/**'
              - '.github/workflows/ci.yml'

  xcode-build:
    name: Xcode build (macOS)
    needs: xcode
    if: needs.xcode.outputs.apple == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build macOS app (unsigned)
        run: |
          xcodebuild -project integrations/apple/joe-links.xcodeproj \
            -target "joe-links (macOS)" -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build iOS app (unsigned, simulator SDK)
        run: |
          xcodebuild -project integrations/apple/joe-links.xcodeproj \
            -target "joe-links (iOS)" -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

  safari:
    name: Safari (TestFlight)
    # Governing: SPEC-0015 REQ "CI Job Integration", ADR-0015. Runs on release
    # tags beside `build` and `docker`, and nothing needs this job, so a
    # signing or upload failure (including the Apple secrets still missing
    # under #221) can never hold up the binaries or the image.
    needs: [lint, test]
    # Prerelease tags (v1.2.3-rc.1) are skipped: the tag-derived build number
    # ignores the suffix, so an rc upload would collide with the final release
    # build and App Store Connect would then reject the release itself.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: macos-latest
    # Two signed archives plus two uploads. Without a ceiling a hung
    # xcodebuild sits on a macOS runner until the 360-minute job limit.
    timeout-minutes: 45
    env:
      # Optional. SPEC-0015 signs with automatic signing, so xcodebuild can
      # create the profiles itself via the App Store Connect API key; these are
      # for teams that manage profiles manually instead.
      APPLE_PROVISIONING_PROFILE_IOS: ${{ secrets.APPLE_PROVISIONING_PROFILE_IOS }}
      APPLE_PROVISIONING_PROFILE_MACOS: ${{ secrets.APPLE_PROVISIONING_PROFILE_MACOS }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        # SPEC-0015 REQ "Code Signing Configuration", scenario "Signing secrets
        # are missing": fail before the macOS runner burns ten minutes on an
        # archive it cannot sign, and name every secret that is absent. Values
        # are mapped into env so the test never expands one into the script or
        # the log.
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_TEAM_ID \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID \
                      APP_STORE_CONNECT_API_KEY_P8; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing Apple signing secret(s): ${missing[*]}. Provision them on the push mirror under #221 (see docs/openspec/specs/safari-extension-testflight/design.md)."
            exit 1
          fi

      - name: Derive version and build number from tag
        id: build_number
        # SPEC-0015 design: CFBundleShortVersionString comes from the tag, and
        # the build number is derived from it. Without the marketing override
        # every release would upload as the 1.0 that is committed in the Xcode
        # project, and App Store Connect only requires build numbers to be new
        # within one version, so pinning both keeps uploads accepted.
        run: |
          number="$("$GITHUB_WORKSPACE/integrations/apple/testflight-build-number.sh" "$GITHUB_REF_NAME")"
          echo "value=$number" >> "$GITHUB_OUTPUT"
          echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME -> version ${GITHUB_REF_NAME#v} build $number"

      - name: Install signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          # 6-hour TTL: archiving both platforms outruns the default auto-lock,
          # and codesign then blocks on a prompt nobody can answer.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -P "$APPLE_CERT_PASSWORD" \
            -k "$keychain" -t cert -f pkcs12
          # Without this ACL codesign is not trusted to use the key headlessly.
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            "$(security default-keychain -d user | tr -d '"')"
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        # Optional (see the job env block): installs whichever profiles exist.
        if: env.APPLE_PROVISIONING_PROFILE_IOS != '' || env.APPLE_PROVISIONING_PROFILE_MACOS != ''
        run: |
          for platform in IOS MACOS; do
            var="APPLE_PROVISIONING_PROFILE_$platform"
            profile="${!var:-}"
            [ -z "$profile" ] && continue
            case "$platform" in
              # .mobileprovision is the iOS profile format and macOS profiles
              # are read only as .provisionprofile, from the Xcode user-data
              # directory; the MobileDevice location exists only for iOS.
              IOS)
                ext=mobileprovision
                dests=("$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles") ;;
              MACOS)
                ext=provisionprofile
                dests=("$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles") ;;
            esac
            decoded="$RUNNER_TEMP/$platform.$ext"
            printf '%s' "$profile" | base64 --decode > "$decoded"
            # Xcode 14 and earlier read the old location, Xcode 15+ the new
            # one; the runner image decides which is live, so install to both.
            for dest in "${dests[@]}"; do
              mkdir -p "$dest"
              cp "$decoded" "$dest/joe-links-$platform.$ext"
            done
            echo "Installed the $platform provisioning profile."
          done

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          # xcrun altool wants <keys dir>/AuthKeys/AuthKey_<KEYID>.p8;
          # xcodebuild takes the file directly via -authenticationKeyPath.
          mkdir -p "$RUNNER_TEMP/AuthKeys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" \
            > "$RUNNER_TEMP/AuthKeys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/AuthKeys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8"

      - name: Archive iOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project integrations/apple/joe-links.xcodeproj \
            -target "joe-links (iOS)" -sdk iphoneos -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ios.xcarchive" \
            MARKETING_VERSION="${{ steps.build_number.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKeys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Archive macOS app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project integrations/apple/joe-links.xcodeproj \
            -target "joe-links (macOS)" -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/macos.xcarchive" \
            MARKETING_VERSION="${{ steps.build_number.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKeys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Export iOS .ipa and macOS .pkg
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          # ExportOptions is written per run: the team ID is a secret, so the
          # plists cannot be committed. app-store-connect is the method name
          # from Xcode 15 on (macos-latest ships 16.x); older Xcode calls it
          # app-store. There is deliberately no -exportFormat flag: it does not
          # exist (xcodebuild -exportArchive takes only -archivePath,
          # -exportPath and -exportOptionsPlist, and exits EX_USAGE on an
          # unknown option). The export format comes from the archive itself:
          # an iOS archive exports as .ipa, a macOS one as .pkg.
          for platform in ios macos; do
            case "$platform" in
              ios) archive="$RUNNER_TEMP/ios.xcarchive" ;;
              macos) archive="$RUNNER_TEMP/macos.xcarchive" ;;
            esac
            cat > "$RUNNER_TEMP/ExportOptions-$platform.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
            xcodebuild -exportArchive \
              -archivePath "$archive" \
              -exportPath "$RUNNER_TEMP/export-$platform" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-$platform.plist" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKeys/AuthKey_$APP_STORE_CONNECT_API_KEY_ID.p8" \
              -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
              -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          done

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          # SPEC-0015 design chose altool over fastlane deliver: no Ruby
          # toolchain for a single upload. Apple is retiring it, so if it
          # disappears from the image the job says so plainly instead of failing
          # on an unknown flag.
          if ! xcrun --find altool >/dev/null 2>&1; then
            echo "::error::xcrun altool is gone from this runner image; move this step to the App Store Connect API (SPEC-0015 design, Risks)."
            exit 1
          fi
          for platform in ios macos; do
            case "$platform" in
              ios) type=iphone; dir="$RUNNER_TEMP/export-ios" ;;
              macos) type=macos; dir="$RUNNER_TEMP/export-macos" ;;
            esac
            artifacts=("$dir"/*)
            if [ ! -e "${artifacts[0]}" ]; then
              echo "::error::Nothing was exported to $dir, so there is nothing to upload."
              exit 1
            fi
            for artifact in "${artifacts[@]}"; do
              echo "Uploading $(basename "$artifact") as a $type build."
              if ! xcrun altool --upload-app --type "$type" -f "$artifact" \
                --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
                --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID" \
                --privateKeysPath "$RUNNER_TEMP/AuthKeys"; then
                echo "::error::TestFlight upload failed for $(basename "$artifact"): App Store Connect rejected the build. expired or invalid API key, or a build number already uploaded."
                exit 1
              fi
            done
          done

      - name: Remove signing material
        # The runner is ephemeral, but the keychain, the .p8 and the exported
        # bundles should not outlive the job that needed them.
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/AuthKeys" "$RUNNER_TEMP/export-ios" "$RUNNER_TEMP/export-macos"
          rm -f "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.provisionprofile \
            "$RUNNER_TEMP"/ExportOptions-*.plist
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

  build:
    name: Build & Release
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build CSS
        run: npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          VERSION="${{ github.ref_name }}"
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          PKG="github.com/joestump/joe-links/internal/build"
          for GOOS in linux darwin windows; do
            for GOARCH in amd64 arm64; do
              [ "$GOOS" = "windows" ] && [ "$GOARCH" = "arm64" ] && continue
              EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
              OUTPUT="dist/joe-links-${GOOS}-${GOARCH}${EXT}"
              GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build \
                -ldflags="-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=${BRANCH}" \
                -o "$OUTPUT" ./cmd/joe-links
              echo "Built $OUTPUT"
            done
          done

      - name: Package browser extension
        # icons/generate*.js are Node dev scripts, not extension code — AMO
        # flags unreferenced files in the package. Note the explicit file list
        # silently omits any newly added extension file (see PR #238).
        run: |
          cd integrations/extension
          zip -r ../../dist/joe-links-extension.zip \
            manifest.json background.js options.html options.js popup.html popup.js icons/ \
            -x "icons/generate*"
          echo "Packaged extension"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Allow updating a release that was pre-created (e.g. with custom notes).
          make_latest: "true"
          fail_on_unmatched_files: false

  docker:
    name: Docker
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto only moves :latest for non-prerelease semver tags, so
          # a v1.2.3-rc.1 tag no longer overwrites :latest (deferred from
          # PR #236 to issue #213). Previously a raw "latest" tag entry
          # applied it unconditionally to every tag build.
          flavor: |
            latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BRANCH=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docs:
    name: GitHub Pages
    needs: [lint, test]
    # Deploy on releases AND on main (push or workflow_dispatch), so docs and
    # spec changes merged to main publish without waiting for the next tag.
    # PR runs never match: their ref is refs/pull/N/merge. See issue #213.
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    # The release flow (merge to main, then tag the merge commit) fires two
    # runs in different ci-* groups, each reaching this job. GitHub Pages
    # allows only one in-flight deployment, so the later deploy-pages call
    # would 409 without serializing deployments here. Queue behind an
    # in-flight deploy; never cancel it. See PR #250 review.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Build docs site
        working-directory: docs-site
        run: npm ci && npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

      - uses: actions/deploy-pages@v4
        id: deployment
